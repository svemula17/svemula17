<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Sai Kumar Vemula — Security Engineer, DevSecOps, AI and LLM Security">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#18213A" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1020" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0B1020" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0B1020" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7EE787" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#0B1020"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#fade)"/>
    <rect x="0" y="0" width="6" height="320" fill="#7EE787"/>
  </g>

  <!-- left: identity -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">
    <text x="64" y="84" fill="#7EE787">~/svemula17 $ <tspan fill="#C9D1D9">whoami</tspan></text>
  </g>
  <text x="64" y="152" fill="#E6EDF3" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-0.5">Sai Kumar Vemula</text>
  <text x="64" y="198" fill="#79C0FF" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500">Security Engineer  ·  DevSecOps  ·  AI &amp; LLM Security</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#8B949E">
    <text x="64" y="252">&gt; guardrails enforced in code, not in prompts</text>
    <rect x="556" y="237" width="10" height="19" fill="#7EE787">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right: guarded agent graph -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" text-anchor="middle">
    <circle cx="1040" cy="160" r="90" fill="url(#glow)"/>

    <!-- allowed edges -->
    <g stroke="#2B3A5C" stroke-width="2">
      <line x1="1040" y1="160" x2="905" y2="92"/>
      <line x1="1040" y1="160" x2="1182" y2="86"/>
      <line x1="1040" y1="160" x2="1200" y2="178"/>
    </g>
    <!-- untrusted input edge -->
    <line x1="1040" y1="160" x2="910" y2="238" stroke="#D29922" stroke-width="2" stroke-dasharray="4 5" opacity="0.8"/>
    <!-- blocked edge -->
    <line x1="1040" y1="160" x2="1150" y2="262" stroke="#F85149" stroke-width="2" stroke-dasharray="6 6" opacity="0.85"/>
    <g transform="translate(1104 219)" stroke="#F85149" stroke-width="3" stroke-linecap="round">
      <circle r="11" fill="#0B1020" stroke-width="2"/>
      <line x1="-5" y1="-5" x2="5" y2="5"/>
      <line x1="5" y1="-5" x2="-5" y2="5"/>
    </g>

    <!-- traffic pulses on allowed edges -->
    <circle r="3.5" fill="#79C0FF">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M905 92 L1040 160"/>
    </circle>
    <circle r="3.5" fill="#79C0FF">
      <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M1040 160 L1182 86"/>
    </circle>
    <circle r="3.5" fill="#79C0FF">
      <animateMotion dur="2.6s" begin="1.7s" repeatCount="indefinite" path="M1040 160 L1200 178"/>
    </circle>

    <!-- guard ring -->
    <circle cx="1040" cy="160" r="44" fill="none" stroke="#7EE787" stroke-width="2" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="0 1040 160" to="360 1040 160" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- nodes -->
    <circle cx="1040" cy="160" r="24" fill="#111A2E" stroke="#7EE787" stroke-width="2"/>
    <text x="1040" y="165" fill="#7EE787" font-size="12">agent</text>

    <circle cx="905" cy="92" r="9" fill="#111A2E" stroke="#79C0FF" stroke-width="2"/>
    <text x="905" y="70" fill="#8B949E">user</text>

    <circle cx="910" cy="238" r="9" fill="#111A2E" stroke="#D29922" stroke-width="2"/>
    <text x="910" y="268" fill="#8B949E">untrusted doc</text>

    <circle cx="1182" cy="86" r="9" fill="#111A2E" stroke="#79C0FF" stroke-width="2"/>
    <text x="1182" y="64" fill="#8B949E">tools</text>

    <circle cx="1200" cy="178" r="9" fill="#111A2E" stroke="#79C0FF" stroke-width="2"/>
    <text x="1200" y="206" fill="#8B949E">mcp</text>

    <circle cx="1150" cy="262" r="9" fill="#111A2E" stroke="#F85149" stroke-width="2"/>
    <text x="1150" y="292" fill="#F85149">exfil · denied</text>
  </g>
</svg>
